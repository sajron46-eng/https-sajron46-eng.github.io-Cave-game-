<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cave Game HTML Recreation</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#frame {
  position: relative;
  width: min(100vw, calc(100vh * 4 / 3));
  height: min(100vh, calc(100vw * 3 / 4));
  background: #000;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #6fb7ff;
}

#stickBase {
  position: absolute;
  left: 22px;
  bottom: 26px;
  width: 112px;
  height: 112px;
  border-radius: 50%;
  background: rgba(180,180,180,0.13);
  border: 2px solid rgba(255,255,255,0.12);
  display: none;
  pointer-events: none;
}

#stickKnob {
  position: absolute;
  left: 36px;
  top: 36px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(220,220,220,0.25);
  border: 2px solid rgba(255,255,255,0.18);
}

.keyBtn {
  position: absolute;
  right: 18px;
  width: 74px;
  height: 42px;
  border-radius: 6px;
  background: rgba(160,160,160,0.18);
  border: 2px solid rgba(255,255,255,0.16);
  color: rgba(255,255,255,0.58);
  font: 12px monospace;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

#placeBtn { bottom: 242px; }
#breakBtn { bottom: 194px; }
#gBtn { bottom: 146px; }
#enterBtn { bottom: 98px; }
#rBtn { bottom: 50px; }

.blockBtn {
  position: absolute;
  bottom: 8px;
  width: 34px;
  height: 34px;
  border-radius: 4px;
  background: rgba(160,160,160,0.16);
  border: 2px solid rgba(255,255,255,0.16);
  color: rgba(255,255,255,0.68);
  font: 13px monospace;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

#b1 { right: 164px; }
#b2 { right: 124px; }
#b3 { right: 84px; }
#b4 { right: 44px; }

.blockBtn.sel {
  background: rgba(255,255,255,0.30);
  border-color: rgba(255,255,255,0.50);
}

#saveNote {
  position: absolute;
  left: 50%;
  top: 14px;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.72);
  font: 12px monospace;
  background: rgba(0,0,0,0.25);
  padding: 4px 8px;
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
}

@media (pointer: coarse) {
  #stickBase, .keyBtn, .blockBtn {
    display: flex;
  }
}
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="128" height="96"></canvas>

  <div id="stickBase"><div id="stickKnob"></div></div>

  <div id="placeBtn" class="keyBtn">RBM</div>
  <div id="breakBtn" class="keyBtn">LBM</div>
  <div id="gBtn" class="keyBtn">G</div>
  <div id="enterBtn" class="keyBtn">ENTER</div>
  <div id="rBtn" class="keyBtn">R</div>

  <div id="b1" class="blockBtn">1</div>
  <div id="b2" class="blockBtn">2</div>
  <div id="b3" class="blockBtn">3</div>
  <div id="b4" class="blockBtn">4</div>

  <div id="saveNote">SAVED</div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;
const image = ctx.createImageData(W, H);
const pixels = image.data;
const zbuf = new Float32Array(W * H);

/*
  IMPORTANT:
  This key must stay the same in all future versions.
  Do not change it when updating the game.
*/
const SAVE_KEY = "cave_game_save";

const OLD_SAVE_KEYS = [
  "cave_game_rd_20090515_world_v2",
  "cave_game_rd_20090515_world_v1",
  "cave_game_rd_132328_changed_blocks_v1",
  "cave_game_rd_132211_changed_blocks_v1"
];

const GAME_VERSION = "current";

const WORLD = 256;
const MAX_Y = 64;
const SURFACE_Y = 30;

const AIR = 0;
const GRASS = 1;
const STONE = 2;
const DIRT = 3;
const PLANKS = 4;

const RENDER_DISTANCE = 34;
const HUMAN_RENDER_DISTANCE = 30;
const BUILD_DISTANCE = 5.5;
const HUMAN_MAX = 180;

const changed = new Map();
const humans = [];

let selectedBlock = GRASS;
let createdHumansCount = 0;

const player = {
  x: 128.5,
  y: SURFACE_Y + 1.02,
  z: 128.5,
  vy: 0,
  yaw: 0,
  pitch: 0,
  radius: 0.28,
  height: 1.62
};

const keys = Object.create(null);

const touchMove = { x: 0, z: 0 };
let joyId = null;
let lookId = null;
let joyStartX = 0;
let joyStartY = 0;
let lastLookX = 0;
let lastLookY = 0;

const stickBase = document.getElementById("stickBase");
const stickKnob = document.getElementById("stickKnob");

const placeBtn = document.getElementById("placeBtn");
const breakBtn = document.getElementById("breakBtn");
const gBtn = document.getElementById("gBtn");
const enterBtn = document.getElementById("enterBtn");
const rBtn = document.getElementById("rBtn");

const b1 = document.getElementById("b1");
const b2 = document.getElementById("b2");
const b3 = document.getElementById("b3");
const b4 = document.getElementById("b4");

const blockButtons = [null, b1, b2, b3, b4];

const saveNote = document.getElementById("saveNote");

let cachedTarget = { hit: false };
let targetTimer = 0;
let saveNoteTimer = 0;

function blockKey(x, y, z) {
  return x + "," + y + "," + z;
}

function clamp(v, a, b) {
  return v < a ? a : v > b ? b : v;
}

function fract(v) {
  return v - Math.floor(v);
}

function hash3(x, y, z) {
  let n = x * 15731 + y * 789221 + z * 1376312589;
  n = (n << 13) ^ n;
  return 1.0 - (((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824.0);
}

function rand01(i) {
  const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function generatedBlock(x, y, z) {
  if (x < 0 || z < 0 || x >= WORLD || z >= WORLD) return AIR;
  if (y < 0 || y >= MAX_Y) return AIR;

  if (y > SURFACE_Y) return AIR;
  if (y === SURFACE_Y) return GRASS;
  return STONE;
}

function blockAt(x, y, z) {
  x = Math.floor(x);
  y = Math.floor(y);
  z = Math.floor(z);

  const k = blockKey(x, y, z);
  if (changed.has(k)) return changed.get(k);

  return generatedBlock(x, y, z);
}

function setBlock(x, y, z, type) {
  x = Math.floor(x);
  y = Math.floor(y);
  z = Math.floor(z);

  if (x < 0 || z < 0 || x >= WORLD || z >= WORLD) return;
  if (y < 0 || y >= MAX_Y) return;

  const natural = generatedBlock(x, y, z);
  const k = blockKey(x, y, z);

  if (type === natural) changed.delete(k);
  else changed.set(k, type);
}

function setSelectedBlock(type, autosave = true) {
  selectedBlock = type;

  for (let i = 1; i <= 4; i++) {
    blockButtons[i].classList.toggle("sel", i === selectedBlock);
  }

  if (autosave) saveWorld(false);
}

function normalizeChangedBlocks(raw) {
  const result = [];

  if (!Array.isArray(raw)) return result;

  for (const item of raw) {
    if (typeof item === "string") {
      const p = item.split(",");
      if (p.length !== 4) continue;

      const x = Number(p[0]);
      const y = Number(p[1]);
      const z = Number(p[2]);
      const type = Number(p[3]);

      if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
      if (![AIR, GRASS, STONE, DIRT, PLANKS].includes(type)) continue;

      result.push({ x, y, z, type });
      continue;
    }

    if (item && typeof item === "object") {
      const x = Number(item.x);
      const y = Number(item.y);
      const z = Number(item.z);
      const type = Number(item.type);

      if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
      if (![AIR, GRASS, STONE, DIRT, PLANKS].includes(type)) continue;

      result.push({ x, y, z, type });
    }
  }

  return result;
}

function applySaveData(data) {
  if (!data) return false;

  let blocksRaw = null;

  if (Array.isArray(data)) {
    blocksRaw = data;
  } else if (Array.isArray(data.changedBlocks)) {
    blocksRaw = data.changedBlocks;
  } else if (Array.isArray(data.changed)) {
    blocksRaw = data.changed;
  }

  changed.clear();

  const blocks = normalizeChangedBlocks(blocksRaw);

  for (const b of blocks) {
    changed.set(blockKey(b.x, b.y, b.z), b.type);
  }

  if (data && Number.isFinite(data.selectedBlock) && data.selectedBlock >= 1 && data.selectedBlock <= 4) {
    selectedBlock = data.selectedBlock;
  }

  humans.length = 0;

  if (data && Array.isArray(data.humans)) {
    for (let i = 0; i < data.humans.length; i++) {
      if (humans.length >= HUMAN_MAX) break;

      const h = data.humans[i];

      const x = Number(h.x);
      const z = Number(h.z);

      if (!Number.isFinite(x) || !Number.isFinite(z)) continue;
      if (x < 1.5 || z < 1.5 || x > WORLD - 1.5 || z > WORLD - 1.5) continue;
      if (blockAt(x, SURFACE_Y + 1, z) !== AIR) continue;
      if (blockAt(x, SURFACE_Y, z) === AIR) continue;

      humans.push(makeHuman(x, z, Number.isFinite(h.seed) ? h.seed : i + 700));
    }
  }

  if (data && Number.isFinite(data.createdHumansCount)) {
    createdHumansCount = Math.max(0, Math.floor(data.createdHumansCount));
  } else {
    createdHumansCount = humans.length;
  }

  return true;
}

function readSaveFromKey(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function loadWorld() {
  const mainSave = readSaveFromKey(SAVE_KEY);

  if (mainSave && applySaveData(mainSave)) {
    return;
  }

  for (const oldKey of OLD_SAVE_KEYS) {
    const oldSave = readSaveFromKey(oldKey);

    if (oldSave && applySaveData(oldSave)) {
      saveWorld(false);
      return;
    }
  }
}

function saveWorld(showNote = true) {
  const changedBlocks = [];

  changed.forEach((type, k) => {
    const p = k.split(",");
    changedBlocks.push({
      x: Number(p[0]),
      y: Number(p[1]),
      z: Number(p[2]),
      type
    });
  });

  const humanSave = [];

  for (let i = 0; i < humans.length; i++) {
    const h = humans[i];

    humanSave.push({
      x: Math.round(h.x * 100) / 100,
      z: Math.round(h.z * 100) / 100,
      seed: h.seed
    });
  }

  const saveData = {
    saveVersion: 1,
    gameVersion: GAME_VERSION,
    changedBlocks,
    selectedBlock,
    humans: humanSave,
    createdHumansCount
  };

  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));

    if (showNote) {
      saveNoteTimer = 1.0;
      saveNote.style.opacity = "1";
    }
  } catch (e) {}
}

function respawnToSurface() {
  player.x = clamp(player.x, 1.5, WORLD - 2.5);
  player.z = clamp(player.z, 1.5, WORLD - 2.5);
  player.y = SURFACE_Y + 1.02;
  player.vy = 0;
}

function makeHuman(x, z, seed) {
  return {
    x,
    y: SURFACE_Y + 1.01,
    z,
    dir: rand01(seed * 3 + 3) * Math.PI * 2,
    speed: 0.55 + rand01(seed * 5 + 4) * 0.45,
    timer: rand01(seed * 7 + 5) * 3,
    walk: rand01(seed * 11 + 6) > 0.35,
    seed
  };
}

function spawnHumanNearPlayer() {
  if (humans.length >= HUMAN_MAX) return;

  const base = performance.now() * 0.001 + humans.length * 17;
  const ang = player.yaw + Math.PI / 2 + (rand01(base) - 0.5) * 1.4;
  let dist = 2.2 + rand01(base + 9) * 1.6;

  for (let i = 0; i < 8; i++) {
    const x = clamp(player.x + Math.sin(ang + i * 0.7) * dist, 1.5, WORLD - 2.5);
    const z = clamp(player.z + Math.cos(ang + i * 0.7) * dist, 1.5, WORLD - 2.5);

    if (blockAt(x, SURFACE_Y + 1, z) === AIR && blockAt(x, SURFACE_Y, z) !== AIR) {
      humans.push(makeHuman(x, z, humans.length + 500 + createdHumansCount));
      createdHumansCount++;
      saveWorld(false);
      return;
    }

    dist += 0.8;
  }
}

function updateHumans(dt) {
  const farLimitSq = 52 * 52;

  for (let i = 0; i < humans.length; i++) {
    const h = humans[i];

    const dxp = h.x - player.x;
    const dzp = h.z - player.z;
    const dsq = dxp * dxp + dzp * dzp;

    if (dsq > farLimitSq) continue;

    h.timer -= dt;

    if (h.timer <= 0) {
      h.timer = 0.7 + rand01(performance.now() * 0.001 + i * 13.13) * 3.2;
      h.dir += -1.6 + rand01(performance.now() * 0.002 + i * 9.91) * 3.2;
      h.walk = rand01(performance.now() * 0.003 + i * 5.17) > 0.28;
    }

    if (!h.walk) continue;

    const vx = Math.sin(h.dir) * h.speed * dt;
    const vz = Math.cos(h.dir) * h.speed * dt;

    const nx = h.x + vx;
    const nz = h.z + vz;

    if (
      nx < 1.5 || nz < 1.5 || nx > WORLD - 1.5 || nz > WORLD - 1.5 ||
      blockAt(nx, SURFACE_Y + 1, nz) !== AIR ||
      blockAt(nx, SURFACE_Y, nz) === AIR
    ) {
      h.dir += Math.PI * (0.5 + rand01(i + performance.now() * 0.01));
      h.walk = false;
      h.timer = 0.35 + rand01(i + 31) * 1.1;
      continue;
    }

    h.x = nx;
    h.z = nz;
  }
}

function texColor(type, faceAxis, step, wx, wy, wz) {
  let u = 0;
  let v = 0;

  if (faceAxis === 0) {
    u = fract(wz);
    v = fract(wy);
  } else if (faceAxis === 1) {
    u = fract(wx);
    v = fract(wz);
  } else {
    u = fract(wx);
    v = fract(wy);
  }

  const tx = Math.floor(u * 8);
  const ty = Math.floor(v * 8);
  const noise = hash3(Math.floor(wx * 2) + tx, Math.floor(wy * 2) + ty, Math.floor(wz * 2));

  let r = 0;
  let g = 0;
  let b = 0;

  if (type === GRASS) {
    if (faceAxis === 1 && step < 0) {
      r = 58 + noise * 18;
      g = 140 + noise * 30;
      b = 44 + noise * 14;
      if (((tx + ty) & 3) === 0) g += 12;
    } else {
      r = 104 + noise * 18;
      g = 82 + noise * 12;
      b = 44 + noise * 10;
      if (ty < 2) {
        r = 68 + noise * 14;
        g = 122 + noise * 20;
        b = 42 + noise * 10;
      }
    }
  }

  if (type === STONE) {
    const crack = (((tx >> 1) + (ty >> 1)) & 1);
    const q = 84 + noise * 34 - crack * 8;

    r = q;
    g = q;
    b = q;

    if (tx % 2 === 0 || ty % 2 === 0) {
      r -= 10;
      g -= 10;
      b -= 10;
    }

    if (((tx * 3 + ty * 5) & 7) === 0) {
      r -= 12;
      g -= 12;
      b -= 12;
    }
  }

  if (type === DIRT) {
    r = 96 + noise * 26;
    g = 62 + noise * 18;
    b = 34 + noise * 12;

    if (((tx + ty * 2) & 5) === 0) {
      r -= 14;
      g -= 10;
      b -= 6;
    }
  }

  if (type === PLANKS) {
    r = 132 + noise * 30;
    g = 88 + noise * 18;
    b = 42 + noise * 10;

    if (ty === 1 || ty === 5) {
      r -= 22;
      g -= 16;
      b -= 8;
    }

    if ((tx + Math.floor(ty / 2)) % 4 === 0) {
      r += 12;
      g += 6;
    }
  }

  return [r, g, b];
}

function raycast(ox, oy, oz, dx, dy, dz, maxDist) {
  let x = Math.floor(ox);
  let y = Math.floor(oy);
  let z = Math.floor(oz);

  const stepX = dx > 0 ? 1 : -1;
  const stepY = dy > 0 ? 1 : -1;
  const stepZ = dz > 0 ? 1 : -1;

  const tDeltaX = dx !== 0 ? Math.abs(1 / dx) : 1e30;
  const tDeltaY = dy !== 0 ? Math.abs(1 / dy) : 1e30;
  const tDeltaZ = dz !== 0 ? Math.abs(1 / dz) : 1e30;

  let tMaxX = dx > 0 ? (Math.floor(ox) + 1 - ox) / dx : (ox - Math.floor(ox)) / -dx;
  let tMaxY = dy > 0 ? (Math.floor(oy) + 1 - oy) / dy : (oy - Math.floor(oy)) / -dy;
  let tMaxZ = dz > 0 ? (Math.floor(oz) + 1 - oz) / dz : (oz - Math.floor(oz)) / -dz;

  if (!isFinite(tMaxX)) tMaxX = 1e30;
  if (!isFinite(tMaxY)) tMaxY = 1e30;
  if (!isFinite(tMaxZ)) tMaxZ = 1e30;

  let dist = 0;
  let axis = 1;
  let step = -1;

  for (let i = 0; i < 72; i++) {
    if (tMaxX < tMaxY && tMaxX < tMaxZ) {
      x += stepX;
      dist = tMaxX;
      tMaxX += tDeltaX;
      axis = 0;
      step = stepX;
    } else if (tMaxY < tMaxZ) {
      y += stepY;
      dist = tMaxY;
      tMaxY += tDeltaY;
      axis = 1;
      step = stepY;
    } else {
      z += stepZ;
      dist = tMaxZ;
      tMaxZ += tDeltaZ;
      axis = 2;
      step = stepZ;
    }

    if (dist > maxDist) break;

    const type = blockAt(x, y, z);

    if (type !== AIR) {
      return {
        hit: true,
        type,
        x,
        y,
        z,
        dist,
        axis,
        step,
        wx: ox + dx * dist,
        wy: oy + dy * dist,
        wz: oz + dz * dist
      };
    }
  }

  return { hit: false, dist: maxDist };
}

function cameraDir() {
  const sy = Math.sin(player.yaw);
  const cy = Math.cos(player.yaw);
  const sp = Math.sin(player.pitch);
  const cp = Math.cos(player.pitch);

  return {
    x: sy * cp,
    y: sp,
    z: cy * cp
  };
}

function getTargetBlock() {
  const d = cameraDir();
  return raycast(player.x, player.y + 1.52, player.z, d.x, d.y, d.z, BUILD_DISTANCE);
}

function updateTarget(dt) {
  targetTimer -= dt;

  if (targetTimer <= 0) {
    cachedTarget = getTargetBlock();
    targetTimer = 0.05;
  }
}

function placeBlock() {
  const hit = getTargetBlock();
  if (!hit.hit) return;

  let nx = hit.x;
  let ny = hit.y;
  let nz = hit.z;

  if (hit.axis === 0) nx -= hit.step;
  if (hit.axis === 1) ny -= hit.step;
  if (hit.axis === 2) nz -= hit.step;

  if (blockAt(nx, ny, nz) !== AIR) return;
  if (collidesAt(player.x, player.y, player.z, nx, ny, nz)) return;

  setBlock(nx, ny, nz, selectedBlock);
  cachedTarget = getTargetBlock();
  saveWorld(false);
}

function breakBlock() {
  const hit = getTargetBlock();
  if (!hit.hit) return;

  setBlock(hit.x, hit.y, hit.z, AIR);
  cachedTarget = getTargetBlock();
  saveWorld(false);
}

function drawHumanPart(cx, cy, cz, w, h, r, g, b) {
  if (cz <= 0.2 || cz > HUMAN_RENDER_DISTANCE) return;

  const sx1 = Math.floor(cx - w / 2);
  const sx2 = Math.floor(cx + w / 2);
  const sy1 = Math.floor(cy - h / 2);
  const sy2 = Math.floor(cy + h / 2);

  for (let y = sy1; y <= sy2; y++) {
    if (y < 0 || y >= H) continue;

    for (let x = sx1; x <= sx2; x++) {
      if (x < 0 || x >= W) continue;

      const zi = y * W + x;
      if (cz >= zbuf[zi] - 0.15) continue;

      const edge = x === sx1 || x === sx2 || y === sy1 || y === sy2;
      const shade = edge ? 0.72 : 1.0;
      const pi = zi * 4;

      pixels[pi] = clamp(r * shade, 0, 255);
      pixels[pi + 1] = clamp(g * shade, 0, 255);
      pixels[pi + 2] = clamp(b * shade, 0, 255);
      pixels[pi + 3] = 255;
    }
  }
}

function drawHumans(camera) {
  const list = [];

  for (let i = 0; i < humans.length; i++) {
    const h = humans[i];
    const dx = h.x - player.x;
    const dz = h.z - player.z;
    const d2 = dx * dx + dz * dz;

    if (d2 > HUMAN_RENDER_DISTANCE * HUMAN_RENDER_DISTANCE) continue;

    list.push({ h, d2 });
  }

  list.sort((a, b) => b.d2 - a.d2);

  for (const item of list) {
    const h = item.h;

    const rx = h.x - camera.ox;
    const ry = h.y - camera.oy;
    const rz = h.z - camera.oz;

    const cx = rx * camera.right[0] + ry * camera.right[1] + rz * camera.right[2];
    const cy = rx * camera.up[0] + ry * camera.up[1] + rz * camera.up[2];
    const cz = rx * camera.forward[0] + ry * camera.forward[1] + rz * camera.forward[2];

    if (cz <= 0.2 || cz > HUMAN_RENDER_DISTANCE) continue;

    const baseX = W / 2 + (cx / (cz * camera.scale * camera.aspect)) * W / 2;
    const baseY = H / 2 - (cy / (cz * camera.scale)) * H / 2;

    const s = 34 / cz;
    if (s < 1.0) continue;

    const bob = h.walk ? Math.sin(performance.now() * 0.006 + h.seed) * s * 0.05 : 0;

    drawHumanPart(baseX - s * 0.18, baseY - s * 0.08 + bob, cz, s * 0.22, s * 0.55, 54, 52, 80);
    drawHumanPart(baseX + s * 0.18, baseY - s * 0.08 - bob, cz, s * 0.22, s * 0.55, 54, 52, 80);

    drawHumanPart(baseX, baseY - s * 0.55, cz, s * 0.48, s * 0.62, 58, 76, 150);

    drawHumanPart(baseX - s * 0.42, baseY - s * 0.55 - bob, cz, s * 0.18, s * 0.55, 128, 82, 58);
    drawHumanPart(baseX + s * 0.42, baseY - s * 0.55 + bob, cz, s * 0.18, s * 0.55, 128, 82, 58);

    drawHumanPart(baseX, baseY - s * 1.02, cz, s * 0.46, s * 0.46, 168, 118, 78);
  }
}

function drawCrosshair() {
  const cx = Math.floor(W / 2);
  const cy = Math.floor(H / 2);

  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillRect(cx - 3, cy, 7, 1);
  ctx.fillRect(cx, cy - 3, 1, 7);
}

function drawSelectedIndicator() {
  const x0 = 9;
  const y0 = 7;
  const size = 15;

  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.fillRect(4, 4, 31, 24);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size;
      const v = y / size;
      const wx = u * 2;
      const wy = v * 2;
      const wz = 0;

      const c = texColor(selectedBlock, 1, -1, wx, wy, wz);
      ctx.fillStyle = "rgb(" + Math.floor(c[0]) + "," + Math.floor(c[1]) + "," + Math.floor(c[2]) + ")";
      ctx.fillRect(x0 + x, y0 + y, 1, 1);
    }
  }

  ctx.fillStyle = "rgba(255,255,255,0.82)";
  ctx.font = "8px monospace";
  ctx.fillText(String(selectedBlock), 26, 18);
}

function render() {
  const target = cachedTarget;

  const fov = Math.PI / 3.1;
  const aspect = W / H;
  const scale = Math.tan(fov * 0.5);

  const sy = Math.sin(player.yaw);
  const cy = Math.cos(player.yaw);
  const sp = Math.sin(player.pitch);
  const cp = Math.cos(player.pitch);

  const forward = [sy * cp, sp, cy * cp];
  const right = [cy, 0, -sy];
  const up = [-sy * sp, cp, -cy * sp];

  const ox = player.x;
  const oy = player.y + 1.52;
  const oz = player.z;

  let p = 0;
  let zi = 0;

  for (let y = 0; y < H; y++) {
    const py = (1 - (y + 0.5) / H * 2) * scale;

    for (let x = 0; x < W; x++) {
      const px = (((x + 0.5) / W) * 2 - 1) * scale * aspect;

      let dx = forward[0] + right[0] * px + up[0] * py;
      let dy = forward[1] + right[1] * px + up[1] * py;
      let dz = forward[2] + right[2] * px + up[2] * py;

      const len = Math.hypot(dx, dy, dz);
      dx /= len;
      dy /= len;
      dz /= len;

      const hit = raycast(ox, oy, oz, dx, dy, dz, RENDER_DISTANCE);

      let r;
      let g;
      let b;

      if (!hit.hit) {
        const t = y / H;
        r = 112 - t * 18;
        g = 183 - t * 28;
        b = 255 - t * 36;
        zbuf[zi++] = 9999;
      } else {
        zbuf[zi++] = hit.dist;

        const col = texColor(hit.type, hit.axis, hit.step, hit.wx, hit.wy, hit.wz);

        r = col[0];
        g = col[1];
        b = col[2];

        let shade = 1 / (1 + hit.dist * 0.045);

        if (hit.axis === 1) shade *= hit.step < 0 ? 1.18 : 0.48;
        else if (hit.axis === 0) shade *= 0.72;
        else shade *= 0.84;

        if (
          target.hit &&
          hit.x === target.x &&
          hit.y === target.y &&
          hit.z === target.z
        ) {
          shade *= 1.45;
          r += 34;
          g += 34;
          b += 34;
        }

        shade = clamp(shade, 0.14, 1.35);

        r *= shade;
        g *= shade;
        b *= shade;

        const fog = clamp(hit.dist / RENDER_DISTANCE, 0, 1);

        r = r * (1 - fog) + 112 * fog;
        g = g * (1 - fog) + 183 * fog;
        b = b * (1 - fog) + 255 * fog;
      }

      pixels[p++] = clamp(r, 0, 255);
      pixels[p++] = clamp(g, 0, 255);
      pixels[p++] = clamp(b, 0, 255);
      pixels[p++] = 255;
    }
  }

  drawHumans({
    ox,
    oy,
    oz,
    forward,
    right,
    up,
    scale,
    aspect
  });

  ctx.putImageData(image, 0, 0);
  drawCrosshair();
  drawSelectedIndicator();
}

function collidesAt(px, py, pz, extraX, extraY, extraZ) {
  const r = player.radius;

  const minX = px - r;
  const maxX = px + r;
  const minY = py + 0.05;
  const maxY = py + player.height;
  const minZ = pz - r;
  const maxZ = pz + r;

  for (let x = Math.floor(minX); x <= Math.floor(maxX); x++) {
    for (let y = Math.floor(minY); y <= Math.floor(maxY); y++) {
      for (let z = Math.floor(minZ); z <= Math.floor(maxZ); z++) {
        if (extraX !== undefined && x === extraX && y === extraY && z === extraZ) return true;
        if (blockAt(x, y, z) !== AIR) return true;
      }
    }
  }

  return false;
}

function movePlayer(dt) {
  let mx = 0;
  let mz = 0;

  if (keys["KeyW"]) mz += 1;
  if (keys["KeyS"]) mz -= 1;
  if (keys["KeyA"]) mx -= 1;
  if (keys["KeyD"]) mx += 1;

  mx += touchMove.x;
  mz += touchMove.z;

  const mag = Math.hypot(mx, mz);

  if (mag > 0) {
    mx /= mag;
    mz /= mag;
  }

  const speed = 4.15;
  const sin = Math.sin(player.yaw);
  const cos = Math.cos(player.yaw);

  const vx = (sin * mz + cos * mx) * speed * dt;
  const vz = (cos * mz - sin * mx) * speed * dt;

  let nx = player.x + vx;
  if (!collidesAt(nx, player.y, player.z)) player.x = nx;

  let nz = player.z + vz;
  if (!collidesAt(player.x, player.y, nz)) player.z = nz;

  player.vy -= 22 * dt;
  player.vy = Math.max(player.vy, -38);

  let ny = player.y + player.vy * dt;

  if (collidesAt(player.x, ny, player.z)) {
    if (player.vy < 0) {
      while (collidesAt(player.x, ny, player.z)) ny += 0.03;
      player.y = ny;
      player.vy = 0;
    } else {
      while (collidesAt(player.x, ny, player.z)) ny -= 0.03;
      player.y = ny;
      player.vy = 0;
    }
  } else {
    player.y = ny;
  }
}

window.addEventListener("keydown", e => {
  keys[e.code] = true;

  if (e.code === "Digit1") setSelectedBlock(GRASS);
  if (e.code === "Digit2") setSelectedBlock(STONE);
  if (e.code === "Digit3") setSelectedBlock(DIRT);
  if (e.code === "Digit4") setSelectedBlock(PLANKS);

  if (e.code === "KeyG") spawnHumanNearPlayer();
  if (e.code === "KeyR") respawnToSurface();
  if (e.code === "Enter") saveWorld(true);

  if (
    e.code === "Space" ||
    e.code === "ShiftLeft" ||
    e.code === "ShiftRight"
  ) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

canvas.addEventListener("click", () => {
  if (canvas.requestPointerLock) canvas.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement === canvas) {
    player.yaw += e.movementX * 0.0029;
    player.pitch -= e.movementY * 0.0029;
    player.pitch = clamp(player.pitch, -1.35, 1.35);
  }
});

canvas.addEventListener("mousedown", e => {
  if (e.button === 0) placeBlock();
  if (e.button === 2) breakBlock();
});

canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
});

placeBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  placeBlock();
}, { passive: false });

breakBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  breakBlock();
}, { passive: false });

gBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  spawnHumanNearPlayer();
}, { passive: false });

enterBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  saveWorld(true);
}, { passive: false });

rBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  respawnToSurface();
}, { passive: false });

b1.addEventListener("touchstart", e => {
  e.preventDefault();
  setSelectedBlock(GRASS);
}, { passive: false });

b2.addEventListener("touchstart", e => {
  e.preventDefault();
  setSelectedBlock(STONE);
}, { passive: false });

b3.addEventListener("touchstart", e => {
  e.preventDefault();
  setSelectedBlock(DIRT);
}, { passive: false });

b4.addEventListener("touchstart", e => {
  e.preventDefault();
  setSelectedBlock(PLANKS);
}, { passive: false });

function isUiTarget(target) {
  return target === placeBtn ||
         target === breakBtn ||
         target === gBtn ||
         target === enterBtn ||
         target === rBtn ||
         target === b1 ||
         target === b2 ||
         target === b3 ||
         target === b4;
}

function getTouchSide(t) {
  const rect = canvas.getBoundingClientRect();
  const x = t.clientX - rect.left;
  return x < rect.width * 0.45 ? "left" : "right";
}

window.addEventListener("touchstart", e => {
  e.preventDefault();

  for (const t of e.changedTouches) {
    const target = document.elementFromPoint(t.clientX, t.clientY);
    if (isUiTarget(target)) continue;

    const side = getTouchSide(t);

    if (side === "left" && joyId === null) {
      joyId = t.identifier;
      joyStartX = t.clientX;
      joyStartY = t.clientY;
      touchMove.x = 0;
      touchMove.z = 0;

      stickBase.style.left = (joyStartX - 56) + "px";
      stickBase.style.top = (joyStartY - 56) + "px";
      stickBase.style.bottom = "auto";
      stickKnob.style.left = "36px";
      stickKnob.style.top = "36px";
    } else if (side === "right" && lookId === null) {
      lookId = t.identifier;
      lastLookX = t.clientX;
      lastLookY = t.clientY;
    }
  }
}, { passive: false });

window.addEventListener("touchmove", e => {
  e.preventDefault();

  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      let dx = t.clientX - joyStartX;
      let dy = t.clientY - joyStartY;

      const max = 42;
      const d = Math.hypot(dx, dy);

      if (d > max) {
        dx = dx / d * max;
        dy = dy / d * max;
      }

      touchMove.x = dx / max;
      touchMove.z = -dy / max;

      stickKnob.style.left = (36 + dx) + "px";
      stickKnob.style.top = (36 + dy) + "px";
    }

    if (t.identifier === lookId) {
      const dx = t.clientX - lastLookX;
      const dy = t.clientY - lastLookY;

      player.yaw += dx * 0.0055;
      player.pitch -= dy * 0.0055;
      player.pitch = clamp(player.pitch, -1.35, 1.35);

      lastLookX = t.clientX;
      lastLookY = t.clientY;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();

  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null;
      touchMove.x = 0;
      touchMove.z = 0;

      stickBase.style.left = "22px";
      stickBase.style.top = "auto";
      stickBase.style.bottom = "26px";
      stickKnob.style.left = "36px";
      stickKnob.style.top = "36px";
    }

    if (t.identifier === lookId) lookId = null;
  }
}

window.addEventListener("touchend", endTouch, { passive: false });
window.addEventListener("touchcancel", endTouch, { passive: false });

window.addEventListener("beforeunload", () => {
  saveWorld(false);
});

let last = performance.now();
let renderAccumulator = 0;

function loop(now) {
  let dt = (now - last) / 1000;
  last = now;

  dt = Math.min(dt, 0.05);

  movePlayer(dt);
  updateTarget(dt);
  updateHumans(dt);

  if (saveNoteTimer > 0) {
    saveNoteTimer -= dt;
    if (saveNoteTimer <= 0) saveNote.style.opacity = "0";
  }

  renderAccumulator += dt;

  if (renderAccumulator >= 1 / 30) {
    renderAccumulator = 0;
    render();
  }

  requestAnimationFrame(loop);
}

loadWorld();
respawnToSurface();
setSelectedBlock(selectedBlock, false);
render();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
